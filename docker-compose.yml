# Production-style stack: API + PostgreSQL.
# Required variables (see .env.example): API_KEYS, CORS_ORIGINS, POSTGRES_PASSWORD.
name: multilingual-ai-evaluator

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evaluator}
      POSTGRES_USER: ${POSTGRES_USER:-evaluator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: multilingual-ai-evaluator:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-evaluator}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-evaluator}
      API_KEYS: ${API_KEYS:?Set API_KEYS in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_WEIGHT: ${GEMINI_WEIGHT:-0.6}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api_logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend]

volumes:
  pgdata:
  api_logs:

networks:
  backend:
